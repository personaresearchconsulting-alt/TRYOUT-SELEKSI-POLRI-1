<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Rekap Nilai Akhir - Persona Research & Consulting</title>
<style>:root{--navy:#0b2340;--gold:#d4af37;--bg:#f3f6f9}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#1f2937}.wrap{max-width:900px;margin:40px auto;padding:20px}.card{background:#fff;border-radius:18px;padding:32px;box-shadow:0 10px 30px rgba(0,0,0,.08)}h1{text-align:center;color:var(--navy);margin:0}.brand{text-align:center;color:#666;margin:10px 0 30px}.name{background:#f8fafc;padding:18px;border-radius:10px;margin-bottom:22px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.item{padding:22px;border:1px solid #e5e7eb;border-radius:12px;text-align:center}.item b{display:block;color:#64748b}.score{font-size:34px;font-weight:bold;color:var(--navy);margin:10px 0}.weight{color:#888}.final{margin-top:25px;background:var(--navy);color:white;padding:30px;border-radius:15px;text-align:center}.final .score{color:var(--gold);font-size:58px}.status{font-weight:bold;font-size:20px}.actions{text-align:center;margin-top:22px}button{border:none;border-radius:9px;padding:14px 20px;margin:5px;font-weight:bold;cursor:pointer;background:var(--navy);color:white}.secondary{background:#64748b}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{margin:10px auto}.card{padding:20px}}</style></head>
<body><div class="wrap"><div class="card" id="report"><h1>REKAP NILAI AKHIR TRYOUT</h1><div class="brand">PERSONA RESEARCH & CONSULTING</div><div class="name"><b>Nama Peserta:</b> <span id="nama">-</span></div><div class="grid"><div class="item"><b>TES KECERDASAN</b><div class="score" id="kecerdasan">-</div><div class="weight">Bobot 30%</div><div id="bkecerdasan">Kontribusi: -</div></div><div class="item"><b>TES KEPRIBADIAN</b><div class="score" id="kepribadian">-</div><div class="weight">Bobot 30%</div><div id="bkepribadian">Kontribusi: -</div></div><div class="item"><b>TES KECERMATAN</b><div class="score" id="kecermatan">-</div><div class="weight">Bobot 40%</div><div id="bkecermatan">Kontribusi: -</div></div></div><div class="final"><b>NILAI AKHIR AKUMULATIF</b><div class="score" id="akhir">-</div><div class="status" id="status">MENUNGGU DATA LENGKAP</div></div></div><div class="actions"><button onclick="window.print()">CETAK REKAP</button><button class="secondary" onclick="resetData()">RESET DATA TRYOUT</button></div></div>
<script>function getN(k){const v=localStorage.getItem(k);return v===null?null:Number(v)}function tampil(){const nama=localStorage.getItem('prc_nama_peserta')||'-';const a=getN('prc_nilai_kecerdasan'),b=getN('prc_nilai_kepribadian'),c=getN('prc_nilai_kecermatan');document.getElementById('nama').textContent=nama;[['kecerdasan','bkecerdasan',a,.30],['kepribadian','bkepribadian',b,.30],['kecermatan','bkecermatan',c,.40]].forEach(x=>{document.getElementById(x[0]).textContent=x[2]===null?'-':x[2];document.getElementById(x[1]).textContent=x[2]===null?'Kontribusi: -':'Kontribusi: '+(x[2]*x[3]).toFixed(2)});if(a===null||b===null||c===null){document.getElementById('akhir').textContent='DATA BELUM LENGKAP';document.getElementById('status').textContent='SELESAIKAN KETIGA TES TERLEBIH DAHULU';return}const n=a*.30+b*.30+c*.40;document.getElementById('akhir').textContent=n.toFixed(2);document.getElementById('status').textContent='HASIL AKHIR BERDASARKAN BOBOT 30% + 30% + 40%'}function resetData(){if(!confirm('Hapus seluruh hasil tryout pada perangkat ini?'))return;['prc_nama_peserta','prc_nilai_kecerdasan','prc_nilai_kepribadian','prc_nilai_kecermatan','prc_tes_kecerdasan_selesai','prc_tes_kepribadian_selesai','prc_tes_kecermatan_selesai'].forEach(k=>localStorage.removeItem(k));tampil()}tampil();</script></body></html>
