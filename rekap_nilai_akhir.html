<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Nilai Akhir</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #1a252f;
        }

        .table-rekap {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }

        .table-rekap th, .table-rekap td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        .table-rekap th {
            background-color: #2c3e50;
            color: #fff;
        }

        .table-rekap tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .total-row {
            font-weight: bold;
            background-color: #eef2f7 !important;
        }

        .btn-container {
            text-align: center;
        }

        .btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background-color: #219150;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>REKAPITULASI NILAI AKHIR</h2>

    <table class="table-rekap">
        <thead>
            <tr>
                <th>No</th>
                <th>Materi / Subtes</th>
                <th>Nilai</th>
                <th>Keterangan</th>
            </tr>
        </thead>
        <tbody id="rekap-body">
            <!-- Data akan diisi via JavaScript -->
        </tbody>
        <tfoot>
            <tr class="total-row">
                <td colspan="2">NILAI AKHIR KUMULATIF</td>
                <td id="nilai-akhir">0</td>
                <td id="status-akhir">-</td>
            </tr>
        </tfoot>
    </table>

    <div class="btn-container">
        <button class="btn" onclick="window.print()">Cetak Rekap</button>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Ambil data hasil yang tersimpan di localStorage
        const dataHasil = JSON.parse(localStorage.getItem("rekapNilai")) || [
            { materi: "Subtes 1", nilai: 80, ket: "Memenuhi Syarat" },
            { materi: "Subtes 2", nilai: 75, ket: "Memenuhi Syarat" },
            { materi: "Subtes 3", nilai: 85, ket: "Memenuhi Syarat" }
        ];

        const tbody = document.getElementById("rekap-body");
        let totalNilai = 0;

        tbody.innerHTML = "";
        dataHasil.forEach((item, index) => {
            totalNilai += item.nilai;
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>${item.materi}</td>
                <td>${item.nilai}</td>
                <td>${item.ket}</td>
            `;
            tbody.appendChild(tr);
        });

        // Hitung rata-rata nilai akhir
        const rataRata = (totalNilai / dataHasil.length).toFixed(2);
        document.getElementById("nilai-akhir").innerText = rataRata;
        document.getElementById("status-akhir").innerText = rataRata >= 60 ? "MEMENUHI SYARAT" : "TIDAK MEMENUHI SYARAT";
    });
</script>

</body>
</html>
