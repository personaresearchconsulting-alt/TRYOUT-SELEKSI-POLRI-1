<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Nilai</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #1a252f;
        }

        .table-rekap {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }

        .table-rekap th, .table-rekap td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        .table-rekap th {
            background-color: #2c3e50;
            color: #fff;
        }

        .table-rekap tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .total-row {
            font-weight: bold;
            background-color: #eef2f7 !important;
        }

        .btn-container {
            text-align: center;
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background-color: #219150;
        }

        .btn-reset {
            background-color: #e67e22;
        }

        .btn-reset:hover {
            background-color: #d35400;
        }

        .btn-restart {
            background-color: #e74c3c;
        }

        .btn-restart:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>REKAPITULASI NILAI SELESAI</h2>

    <table class="table-rekap">
        <thead>
            <tr>
                <th>No</th>
                <th>Materi / Subtes</th>
                <th>Nilai</th>
                <th>Keterangan</th>
            </tr>
        </thead>
        <tbody id="rekap-body">
            <!-- Data tes yang sudah dikerjakan akan masuk ke sini -->
        </tbody>
        <tfoot>
            <tr class="total-row">
                <td colspan="2">RATA-RATA NILAI SAAT INI</td>
                <td id="nilai-akhir">0</td>
                <td id="status-akhir">-</td>
            </tr>
        </tfoot>
    </table>

    <div class="btn-container">
        <button class="btn" onclick="window.print()">Cetak Hasil</button>
        <button class="btn btn-reset" onclick="resetData()">Reset Data</button>
        <button class="btn btn-restart" onclick="ulangTes()">Ulangi Dari Tes 1</button>
    </div>
</div>

<script>
    function muatDataRekap() {
        const rawData = localStorage.getItem("rekapNilai");
        const dataHasil = rawData ? JSON.parse(rawData) : [];

        const tbody = document.getElementById("rekap-body");
        let totalNilai = 0;

        tbody.innerHTML = "";

        if (dataHasil.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="color: #721c24; background-color: #f8d7da; padding: 15px;">Belum ada data nilai tersimpan. Silakan kerjakan tes terlebih dahulu.</td></tr>`;
            document.getElementById("nilai-akhir").innerText = "0";
            document.getElementById("status-akhir").innerText = "-";
            return;
        }

        dataHasil.forEach((item, index) => {
            const nilaiNum = parseFloat(item.nilai) || 0;
            totalNilai += nilaiNum;
            
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>${item.materi || 'Tes ' + (index + 1)}</td>
                <td>${nilaiNum}</td>
                <td>${item.ket || 'Selesai'}</td>
            `;
            tbody.appendChild(tr);
        });

        const rataRata = (totalNilai / dataHasil.length).toFixed(2);
        document.getElementById("nilai-akhir").innerText = rataRata;
        document.getElementById("status-akhir").innerText = rataRata >= 60 ? "MEMENUHI SYARAT" : "TIDAK MEMENUHI SYARAT";
    }

    // Fungsi Tombol Reset (Hanya mengosongkan tabel & storage tanpa pindah halaman)
    function resetData() {
        if (confirm("Apakah kamu yakin ingin mengosongkan seluruh data rekap nilai ini?")) {
            localStorage.removeItem("rekapNilai");
            muatDataRekap();
        }
    }

    // Fungsi Ulangi Tes (Reset data + Pindah ke tes pertama)
    function ulangTes() {
        if (confirm("Yakin ingin menghapus rekap nilai dan mengulang dari tes pertama?")) {
            localStorage.removeItem("rekapNilai");
            window.location.href = "tes_1.html"; // Sesuaikan nama file tes pertamamu
        }
    }

    document.addEventListener("DOMContentLoaded", muatDataRekap);
</script>

</body>
</html>
